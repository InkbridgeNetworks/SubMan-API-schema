      description: Partial serviceProfile definition for PATCH requests. No fields are required. Setting a field to null removes
        the attribute.
      allOf:
      - $ref: '#/components/schemas/_serviceProfileFields'
    _serviceProfileFields:
      title: _serviceProfileFields
      type: object
      description: All serviceProfile fields, with no required constraints. The serviceProfile, serviceProfileCreate, serviceProfileReplace
        and serviceProfilePatch schemas add the per-method required lists.
      properties:
        id:
          type: string
          example: INET1M
          description: Identifier for the serviceProfile
        description:
          type: string
          description: A human-readable description of the serviceProfile
        serviceProfilePriority:
          type: integer
          description: Priority used to order this serviceProfile when several apply to a subscriber
          example: 10
    freeradiusPolicy:
      title: freeradiusPolicy
      x-stoplight:
        id: ebjv3rkkgvqou
      description: |-
        A set of FreeRADIUS attributes and assignment rules which modify attributes in the current request.  A freeradiusPolicy is the "concrete" implementation of a serviceProfile for one clientGroup, and its id is the id of that clientGroup.  A freeradiusPolicy exists only as a child of a serviceProfile.  A subscriber, a subscriberGroup, or a realm references a serviceProfile through its serviceProfile field, and the freeradiusPolicy that matches the client the subscriber connects through applies.

        Note: The attributes listed in the definition of the object are a subset of the attributes available.

        Any attribute that's available in the relevant LDAP schema (freeradius-radius.schema, freeradius-dhcpv4.schema, freeradius-dhcpv6.schema, etc...) for the protocol, can be included in POST, PATCH, PUT actions, including generic attributes such as `radiusAttribute`.  Generic attributes take the format `<attribute> <op> <quote><value><quote>` e.g. `Reply-Message := "Welcome user %{User-Name}"`, and can be used to add any attribute allowed in the protocol dictionary.
      examples:
      - id: alcatel7750
        radiusAttribute: reply.Vendor-Specific.Nokia-SR.Subsc-ID-Str = "%{User-Name}@example.org"
      allOf:
      - $ref: '#/components/schemas/_freeradiusPolicyFields'
      - type: object
        required:
        - id
    freeradiusPolicyCreate:
      title: freeradiusPolicyCreate
      description: freeradiusPolicy definition for POST requests.
      allOf:
      - $ref: '#/components/schemas/_freeradiusPolicyFields'
      - type: object
        required:
        - id
    freeradiusPolicyReplace:
      title: freeradiusPolicyReplace
      description: freeradiusPolicy definition for PUT requests. The identity field (id) is taken from the URL, and is ignored
        when present in the body.
      allOf:
      - $ref: '#/components/schemas/_freeradiusPolicyFields'
    freeradiusPolicyPatch:
      title: freeradiusPolicyPatch
      description: Partial freeradiusPolicy definition for PATCH requests. No fields are required. Setting a field to null
        removes the attribute.
      allOf:
      - $ref: '#/components/schemas/_freeradiusPolicyFields'
    _freeradiusPolicyFields:
      title: _freeradiusPolicyFields
      type: object
      description: All freeradiusPolicy fields, with no required constraints. The freeradiusPolicy, freeradiusPolicyCreate,
        freeradiusPolicyReplace and freeradiusPolicyPatch schemas add the per-method required lists.
      properties:
        id:
          type: string

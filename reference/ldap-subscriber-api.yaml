  /bulk:
    post:
      operationId: post-bulk
      summary: Run many requests in one call
      description: |
        Submit a list of API requests in a single HTTP call and have the server run them against its own endpoints, then stream back one result per request.

        This saves a round trip per request when a client needs to create, read, update, or delete many resources at once.  The client sends one request; the server replays each entry in the `payload` list against the matching local endpoint (for example `POST /realm`, `DELETE /client/1`) exactly as if the client had called that endpoint directly.

        How a bulk call is processed:

        1. The server reads the `payload` list and validates every entry up front.  If any entry is missing a `url` or `method`, or uses a method other than `GET`, `POST`, `PATCH`, `PUT`, or `DELETE`, the whole call is rejected with `400` before anything runs.
        2. The server groups the entries into batches of `batchSize` (default 20) and runs each batch concurrently.  Entries within a batch run at the same time; batches run one after another.
        3. As each batch finishes, the server streams its results to the client.  The response is sent incrementally, so a large bulk call does not have to be held in memory in full before the client sees the first result.
        4. When every batch is done, the server appends a `stats` object summarising how many requests were processed and how many succeeded.

        The directory authorizes each entry, not the bulk call as a whole.  Each replayed request runs as the directory identity of the caller, so the access controls of the directory authorize each entry separately.  An entry that the directory refuses receives a `403` in the result for the entry, and the rest of the batch still runs.

        Streaming changes how errors are reported.  Once the server has started writing the response body it can no longer change the HTTP status line, so the HTTP status of a bulk call is almost always `200` even when individual entries fail or the run is aborted.  Clients MUST inspect the `code` field inside each result, and the `stats` object, to determine the real outcome.  If a fatal error happens part way through streaming, the server closes the JSON document early and adds top-level `err_msg` and `code` fields describing the failure.

        Transactions (`asTransaction`) are not implemented.  A request that sets `asTransaction` to `true` is rejected with `400`.  Without transactions, a failure in one entry does not roll back entries that already succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payload
              properties:
                payload:
                  type: array
                  minItems: 1
                  description: The list of requests to run.  Each entry is replayed against the API endpoint that matches its `url`.
                  items:
                    type: object
                    required:
                    - url
                    - method
                    properties:
                      url:
                        type: string
                        format: uri-reference
                        description: Resource path to call, relative to the API root.  A leading `/` is added if absent, so `realm/example.org` and `/realm/example.org` are equivalent.
                        example: /realm/example.org
                      method:
                        type: string
                        enum:
                        - GET
                        - POST
                        - PATCH
                        - PUT
                        - DELETE
                        description: HTTP method to use for this entry.
                        example: POST
                      body:
                        description: |
                          Request body for this entry.  Optional for `GET` and `DELETE`.  The type depends on the top-level `jsonBody` flag: when `jsonBody` is `true`, `body` must be a JSON object and the server serialises it before dispatching; when `jsonBody` is `false` (the default), `body` must be an already-serialised JSON string.
                        oneOf:
                        - type: object
                        - type: string
                failEarly:
                  type: boolean
                  default: false
                  description: If `true`, stop as soon as an entry returns a status other than `200` or `201`; remaining entries are not run.  If `false`, run every entry regardless of individual failures.
                jsonBody:
                  type: boolean
                  default: false
                  description: |
                    Controls how each entry's `body` is carried, and how each response body is returned.  When `true`, every entry's `body` must be a JSON object (the server serialises it for the dispatched request) and each response body is parsed back into a JSON object in the result.  When `false`, every entry's `body` must be a pre-serialised string and each response body is returned verbatim as a string.
                batchSize:
                  type: integer
                  minimum: 0
                  default: 20
                  description: Number of entries to run concurrently per batch.  A value of `0` runs the entire payload as a single concurrent batch.
                  example: 20
                asTransaction:
                  type: boolean
                  default: false
                  description: Reserved for transactional processing.  Not implemented; sending `true` is rejected with `400`.
            examples:
              Create two realms:
                value:
                  jsonBody: true
                  payload:
                  - url: /realm/example.org
                    method: POST
                    body:
                      id: example.org
                      description: First realm
                  - url: /realm/example.com
                    method: POST
                    body:
                      id: example.com
                      description: Second realm
      responses:
        '200':
          description: |
            The bulk call was accepted and its results streamed back.  A `200` here does NOT mean every entry succeeded; inspect each result's `code` and the `stats` object.  If the run was aborted mid-stream, top-level `err_msg` and `code` fields are present and the `result` array may be truncated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    description: One entry per request that was run, in payload order.
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri-reference
                          description: The resource path that was called.
                        method:
                          type: string
                          description: The HTTP method that was used.
                        code:
                          type: integer
                          description: The HTTP status code returned by the endpoint for this entry.
                          example: 201
                        body:
                          description: The response body for this entry.  A JSON object when `jsonBody` is `true`, a string otherwise, or absent when the endpoint returned no body.
                          oneOf:
                          - type: object
                          - type: string
                          - type: 'null'
                  stats:
                    type: object
                    description: Summary counts for the whole run.
                    properties:
                      processed:
                        type: integer
                        description: Total number of entries that were run.
                        example: 2
                      successful:
                        type: integer
                        description: Number of entries that returned `200` or `201`.
                        example: 2
                      failed:
                        type: integer
                        description: Number of entries that returned any other status (`processed` minus `successful`).
                        example: 0
                  err_msg:
                    type: string
                    description: Present only when a fatal error aborted the run mid-stream.  Describes the failure.
                  code:
                    type: integer
                    description: Present only alongside `err_msg`.  The HTTP status code that would have been returned had the error happened before streaming started.
        '400':
          description: |
            The bulk request itself was malformed and rejected before any entry ran.  Causes include a missing or empty `payload`, an entry missing `url` or `method`, an entry using an unsupported method, a `body` whose type does not match the `jsonBody` flag, or `asTransaction` set to `true`.
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/onUnauthorized'
        '403':
          $ref: '#/components/responses/onForbidden'
        '405':
          description: Method not allowed.  The bulk endpoint accepts `POST` only.
        '500':
          $ref: '#/components/responses/onInternalServerError'
      tags:
      - Global
    parameters: []
  /rename:
    post:
      operationId: post-rename
      summary: Rename a resource
      description: |
        Rename a single resource in place.  The backend performs an LDAP `modrdn`, so the entry's `entryUUID` and any child objects are preserved across the operation; only the leaf RDN of its DN changes.

        Supported resource families: `realm`, `client`, `service`, `group`, `clientGroup`, `accessDevice`, and any nested resources reachable through their route trees (e.g. ports under `client` or `accessDevice`, profiles under `service`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - id
              properties:
                url:
                  type: string
                  format: uri-reference
                  description: Resource path of the object to rename.
                  example: /realm/example.org
                id:
                  type: string
                  description: The new leaf identifier for the resource.  May be URL-encoded; multi-valued RDNs use `value1+value2`.
                  example: example.com
      responses:
        '200':
          description: |
            Renamed.  The response carries a `Location` header pointing at the new resource URL.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: The new resource URL after rename.
        '400':
          $ref: '#/components/responses/onBadRequest'
        '401':
          $ref: '#/components/responses/onUnauthorized'
        '403':
          $ref: '#/components/responses/onForbidden'
        '404':
          $ref: '#/components/responses/onNotFound'
        '405':
          description: Method not allowed.  Returned when the request verb is not `POST`, when the `url` or `id` field is missing from the body, or when the resolved path is a collection rather than a single object.
        '500':
          $ref: '#/components/responses/onInternalServerError'
      tags:
      - Global
    parameters: []
  /:
    get:
      summary: Read the directory base entry
      operationId: get-root
      x-stoplight:
        id: awyakbe5d2ujc
      tags:
      - Health
      description: |
        The server returns the base entry of the directory, the root of the tree that the API manages, as an object of LDAP attributes.  The request needs a bearer token, and the server reads one entry from the directory.  A 200 therefore proves that the API is running, that the token is valid, and that the directory answers.  Use `GET /` as the readiness probe.

        With `operational=true` the server also returns the operational attributes of the entry, including `contextCSN`, the replication watermark.  After a write, read `contextCSN` from the replication provider.  Then wait for each replication consumer to report a `contextCSN` at or past the value from the provider.

        The server accepts `GET` and `OPTIONS` only, and returns 405 for any other method.
      parameters:
      - $ref: '#/components/parameters/timestamps'
      - $ref: '#/components/parameters/operational'
      responses:
        '200':
          description: The base entry.  The keys of the object are the LDAP attribute names of the entry.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                base entry:
                  value:
                    dc: example
                    o: example
                    objectClass:
                    - top
                    - dcObject
                    - organization
                base entry with operational attributes:
                  value:
                    dc: example
                    o: example
                    objectClass:
                    - top
                    - dcObject
                    - organization
                    entryDN: dc=example,dc=org
                    entryUUID: cabadd8e-4302-1041-94d7-eb772a0d2ad3
                    contextCSN: 20260912143953.381092Z#000000#000#000000
                    createTimestamp: 20260912143423Z
                    modifyTimestamp: 20260912143423Z
        '401':
          $ref: '#/components/responses/onUnauthorized'
        '403':
          $ref: '#/components/responses/onForbidden'
        '404':
          $ref: '#/components/responses/onNotFound'
        '405':
          description: Method not allowed.  On the base entry, the server accepts `GET` and `OPTIONS` only.
        '500':
          $ref: '#/components/responses/onInternalServerError'
    parameters: []
  /test:
    get:
      summary: Liveness probe
      operationId: get-test
      tags:
      - Health
      security: []
      description: |
        The server returns "Testing 123" as `text/plain` without authentication and without reading the directory.  A 200 proves only that nginx and the API code are running.  Use `GET /test` as the liveness probe, for example from a load balancer that holds no credentials.  Use `GET /` as the readiness probe.

        The server returns the same response for every method and for every path below `/test`.
      responses:
        '200':
          description: The API is running.
          content:
            text/plain:
              schema:
                type: string
              example: Testing 123
    parameters: []
components:
  schemas:
    directoryDatabase:
      title: directoryDatabase
      type: object
      description: A database of the directory, with the access controls of the database.  The object carries nothing else from the configuration entry.
      required:
      - id
      - suffix
      - acl
      properties:
        id:
          type: string
          description: Name of the database as `cn=config` orders it.
          example: '{2}mdb'
        suffix:
          type: string
          description: Suffix of the database, the base distinguished name (DN) of the tree that the database holds.
          example: dc=example,dc=org
        acl:
          type: array
          description: The `olcAccess` rules of the database, in the order that the directory evaluates the rules, each without the `{n}` prefix.
          items:
            type: string
          example:
          - to attrs=entry,children by group.exact="cn=subman-admins,ou=groups,dc=example,dc=org" write by * none
          - to * by group.exact="cn=subman-admins,ou=groups,dc=example,dc=org" write by * read
    realm:
      title: realm
      x-stoplight:
        id: or81e5rovv950
      description: Holds a set of subscriber, and LDAP/RADIUS attributes associated with a given realm
      allOf:
      - $ref: '#/components/schemas/_realmFields'
      - type: object
        required:
        - id
    realmCreate:
      title: realmCreate
      description: realm definition for POST requests.
      allOf:
      - $ref: '#/components/schemas/_realmFields'
      - type: object
        required:
        - id
    realmReplace:
      title: realmReplace
      description: realm definition for PUT requests. The identity field (id) is taken from the URL, and is ignored when present
        in the body.
      allOf:
      - $ref: '#/components/schemas/_realmFields'
    realmPatch:
      title: realmPatch
      description: Partial realm definition for PATCH requests. No fields are required. Setting a field to null removes the
        attribute.
      allOf:
      - $ref: '#/components/schemas/_realmFields'
    _realmFields:
      title: _realmFields
      type: object
      description: All realm fields, with no required constraints. The realm, realmCreate, realmReplace and realmPatch schemas
        add the per-method required lists.
      properties:
        id:
          type: string
          description: The realm ID.  This may map directly with the domain portion in a user's NAI, and can be used to separate
            subscriber belonging to different areas of the business, or to external customers
          example: example.org
        description:
          type: string
          description: A humanly readable description of the realm
          example: example.org subscriber are actually foo subscriber, who we are authenticating on behalf of bar
        serviceProfile:
          type: string
          format: uri
          example: http://192.168.0.1/service/fixedLine/profile/INETG1M
          description: The URI of a serviceProfile object to apply to all subscriber in this realm.  The serviceProfile object
            must exist, and referential integrity will be enforced
    subscriber:
      title: subscriber
      x-stoplight:
        id: 39i82q1wb1101
      description: |-
        A subscriber - A user authenticating via the RADIUS service.

        Note: The attributes listed in the definition of the object are a subset of the attributes available.

        Any attribute that's available in the relevant LDAP schema (freeradius-radius.schema, freeradius-dhcpv4.schema, freeradius-dhcpv6.schema, etc...) for the protocol, can be included in POST, PATCH, PUT actions, including generic attributes such as `radiusAttribute`.  Generic attributes take the format `<attribute> <op> <quote><value><quote>` e.g. `Reply-Message := "Welcome user %{User-Name}"`, and can be used to add any attribute allowed in the protocol dictionary.
      allOf:
      - $ref: '#/components/schemas/_subscriberFields'
      - type: object
        required:
        - id
        - subscriberId
        - serviceStatus
        - serviceId
    subscriberCreate:
      title: subscriberCreate
      description: Subscriber definition for POST requests. subscriberId and serviceId may be omitted, the server derives
        subscriberId and serviceId from id. When present, subscriberId and serviceId must match the values encoded in id.
      allOf:
      - $ref: '#/components/schemas/_subscriberFields'
      - type: object
        required:
        - id
        - serviceStatus
    subscriberReplace:
      title: subscriberReplace
      description: Subscriber definition for PUT requests. The identity fields (id, subscriberId, serviceId) are taken from
        the URL, and are ignored when present in the body.
      allOf:
      - $ref: '#/components/schemas/_subscriberFields'
      - type: object
        required:
        - serviceStatus
    subscriberPatch:
      title: subscriberPatch
      description: Partial subscriber definition for PATCH requests. No fields are required. Setting a field to null removes
        the attribute.
      allOf:
      - $ref: '#/components/schemas/_subscriberFields'
    _subscriberFields:
      title: _subscriberFields
      type: object
      description: All subscriber fields, with no required constraints. The subscriber, subscriberCreate, subscriberReplace
        and subscriberPatch schemas add the per-method required lists.
      properties:
        id:
          type: string
          description: Must be set to the combination of subscriberID '+' serviceId.  This uniquely identifies a subscriber
            object for a particular type of service, e.g. fixedLine vs wireless
          example: 123456789+fixedLine
        subscriberId:
          type: string
          description: A unique (within a realm) identifier for a subscriber
          example: '123456789'
        serviceStatus:
          type: string
          enum:
          - enabled
          - disabled
          - suspended
          description: Whether this subscriber can access the service
        statusReason:
          type: string
          description: Why the subscriber's service was disabled or suspended
        serviceId:
          type: string
          description: The type of access media this subscriber object relates to, e.g. fixedLine, wireless etc... Must match
            a configured service category
          example: fixedLine
        serviceProfile:
          type: string
          format: uri
          description: The URI of a service profile object to apply to the subscriber
          example: http://localhost:3000/service/fixedLine/profile/INETG1M
        serviceProfileSuspended:
          type: string
          description: The URI of a service profile object to apply to the subscriber
          format: uri
          example: http://localhost:3000/service/fixedLine/profile/suspendedNonPayment
        subscriberGroup:
          type: array
          format: uri
          description: The URI of a subscriberGroup object.  Used to apply common sets of RADIUS attributes or serviceProfiles
            to subscriber
          uniqueItems: true
          items:
            type: string
            format: uri
        portBindingClient:
          type: string
          format: uri
          description: URI of the last client the subscriber authenticated via.  Primarily used for Change of Authorisation
            and disconnect messages
          example: http://localhost:3000/client/192.0.2.1
        portBindingIdentifier:
          type: string
          format: uri
          example: http://localhost:3000/client/192.0.2.1/port/DSLAM03-D6-KTP%20atm%200%2F0%2F0%2F44:0.35/qinq/100%2B25
          description: The subscriber's unique circuit ID, either learned or pre-provisioned
        portBindingModified:
          type: string
          format: date-time
          description: When port binding details were last updated
          readOnly: true
        portBinding:
          type: boolean
          description: If true, the subscriber will be unabled to authenticate via any other circuit than the one we learned
            the first time the subscriber authenticated
        subscriberLastDisconnected:
          type: string
          format: date-time
          description: When the subscriber was last disconnected.
        subscriberDisconnect:
          type: string
          enum:
          - 'true'
          - 'false'
          - oneshot
          description: |-
            Per-modification RADIUS behaviour for this subscriber:
              - 'true':    any modification to the entry triggers a Disconnect-Request.
              - 'false':   any modification triggers a CoA-Request.
              - 'oneshot': sends an immediate Disconnect-Request, then reverts to 'false'.
        serviceSpeedUpload:
          type: string
          description: Maximum upload bandwidth for the subscriber, as a human-readable rate (digits followed by a B/K/M/G/T/E
            unit suffix)
          example: 500M
        serviceSpeedDownload:
          type: string
          description: Maximum download bandwidth for the subscriber, as a human-readable rate (digits followed by a B/K/M/G/T/E
            unit suffix)
          example: 500M
        staticIpV4Addr:
          type: string
          format: ipv4
          description: Static IPv4 address assigned to the subscriber
          example: 192.0.2.10
        staticIpV4Prefix:
          type: string
          description: Static IPv4 prefix assigned to the subscriber, in CIDR notation
          example: 192.0.2.0/24
        staticIpV6Addr:
          type: string
          format: ipv6
          description: Static IPv6 address assigned to the subscriber
          example: 2001:db8::1
        staticIpV6Prefix:
          type: string
          description: Static IPv6 prefix assigned to the subscriber, in CIDR notation
          example: 2001:db8::/48

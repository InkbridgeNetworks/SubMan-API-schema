    errorResponse:
      title: errorResponse
      description: |
        The body of every error response.  `error_msg` and `code` are always present.  `ldap_code` is present when a directory operation caused the error, and absent when the API refused the request before the request reached the directory.  `ldap_error` is present when `ldap_code` is present and `ldap_code` is not negative.
      type: object
      required:
      - error_msg
      - code
      properties:
        error_msg:
          type: string
          description: The reason that the API or the directory refused the request.  The text is for a person, not for a program.  The text may name a distinguished name (DN), an attribute in the lowercase form that the directory reports, or a value from the request.  A client must not match on the text.
          example: 'Attribute is not in the schema at cn=example.org,ou=realms,dc=example,dc=org: notarealfield: attribute type undefined'
        code:
          type: integer
          description: The HTTP status of the response.  The API repeats the status in the body because an error that ends a streamed collection arrives after the API sent status `200`.  The body is then the only place that carries the status of the error.
          example: 400
        ldap_code:
          type: integer
          description: The directory result code (RFC 4511 section 4.1.9) that caused the error.  The OpenLDAP client library produces a negative value for a lost connection or a timeout.  RFC 4511 defines no name for a negative value.
          example: 17
        ldap_error:
          type: string
          description: The name that RFC 4511 appendix A assigns to the result code in `ldap_code`.  `ldap_error` is present whenever `ldap_code` is present and `ldap_code` is not negative.  To dispatch on the result code, match on `ldap_error`.
          example: undefinedAttributeType

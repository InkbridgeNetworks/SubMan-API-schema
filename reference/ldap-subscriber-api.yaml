        type: string
        example: INETG1M
      description: Identifier for an abstract class of service profile
    subscriberGroupId:
      name: subscriberGroupId
      in: path
      required: true
      schema:
        type: string
      description: Identifier for a group of subscribers
    prune:
      name: prune
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: If true, delete any child objects (e.g. all the subscribers in a realm).
    timestamps:
      name: timestamps
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: |
        If true, include the LDAP `createTimestamp` and `modifyTimestamp` operational attributes on each returned object.  Values are RFC 4517 GeneralizedTime in zulu form (`YYYYMMDDHHMMSSZ`, e.g. `20240519143012Z`) and are passed through unchanged from the directory.
    operational:
      name: operational
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: |
        If true, the server includes every operational attribute of each returned object, such as `entryUUID`, `entryCSN`, `entryDN`, and, on the base entry, `contextCSN`.  The server passes the attribute values through from the directory unchanged.
    accessDeviceId:
      name: accessDeviceId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier for a an accessDevice
    portId:
      name: portId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier for a port, within a client or accessDevice
    policyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
      description: Identifier for an concrete class of service profile
    filter_serviceProfile:
      name: filter_serviceProfile
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: Filter by serviceProfile URI. See "URL filter encoding" in the API description for how to encode the value.
    filter_subscriberId:
      name: filter_subscriberId
      in: query
      required: false
      schema:
        type: string
      description: Filter by subscriberId (exact match).
    filter_serviceStatus:
      name: filter_serviceStatus
      in: query
      required: false
      schema:
        type: string
        enum:
        - enabled
        - disabled
        - suspended
      description: Filter by serviceStatus.
    filter_serviceId:
      name: filter_serviceId
      in: query
      required: false
      schema:
        type: string
      description: Filter by serviceId (e.g. fixedLine, GPON).
    filter_subscriberGroup:
      name: filter_subscriberGroup
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: Filter by subscriberGroup URI membership. See "URL filter encoding" in the API description for how to encode
        the value.
    filter_portBindingClient:
      name: filter_portBindingClient
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: Filter by portBindingClient URI. See "URL filter encoding" in the API description for how to encode the
        value.
    filter_portBindingIdentifier:
      name: filter_portBindingIdentifier
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: Filter by portBindingIdentifier URI. See "URL filter encoding" in the API description for how to encode
        the value.
    filter_freeradiusClientShortname:
      name: filter_freeradiusClientShortname
      in: query
      required: false
      schema:
        type: string
      description: Filter by freeradiusClientShortname (exact match).
    filter_freeradiusClientGroup:
      name: filter_freeradiusClientGroup
      in: query
      required: false
      schema:
        type: string
      description: Filter by freeradiusClientGroup (exact match).
    filter_freeradiusClientType:
      name: filter_freeradiusClientType
      in: query
      required: false
      schema:
        type: string
      description: Filter by freeradiusClientType.
    filter_port:
      name: filter_port
      in: query
      required: false
      schema:
        type: string
      description: Filter by port identifier. Value must be URI-encoded.
    filter_remoteAssociation:
      name: filter_remoteAssociation
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: Filter by remoteAssociation URI. The same URL filter encoding rules as for the other URI filters apply;
        see "URL filter encoding" in the API description.
    qinqId:
      name: qinqId
      in: path
      required: true
      schema:
        type: string
        pattern: ^\d+\+\d+$
      description: QinQ tagging identifier in the form `<svlan>+<cvlan>`. The `+` must be URI-encoded as `%2B` in the request
        URL.
      example: 100+25
    svlan:
      name: svlan
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4094
      description: Outer VLAN (S-VLAN) identifier.
      example: 100
    subscribe:
      name: subscribe
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: |
        When `subscribe` is true, the server sends the response as a Server-Sent Events stream (media type `text/event-stream`).  The stream delivers the initial state of the collection as events, then one event per change, and stays open until the client closes the stream.  `ldap-subscriber-api-stream.yaml` documents the events.  Only a listing endpoint provides the stream.  A single-object endpoint ignores `subscribe`.
    scope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum:
        - onelevel
        - subtree
        default: onelevel
      description: |
        `scope` sets the depth of the stream that `subscribe` opens.  With `onelevel`, the server streams the records of the collection.  With `subtree`, the server streams every record below the collection, at any depth, each described as a separate resource.  The server ignores `scope` when `subscribe` is false.
    access_token:
      name: access_token
      in: query
      required: false
      schema:
        type: string
      description: |
        `access_token` carries a bearer access token for a client that cannot send the `Authorization` header, such as a browser that uses the `EventSource` API.  RFC 6750 section 2.3 defines the query parameter form.  The server accepts `access_token` on GET only, and only when the request carries no `Authorization` header.  The token appears in the URL, so a success response carries `Cache-Control: private`.
    copy_uri:
      name: copy_uri
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: 'URL of an existing resource to copy into the target of this request. The source must be the same resource
        type as the endpoint being called. The HTTP verb determines what happens with the copy: `POST` creates new objects,
        `PUT` replaces existing objects, `PATCH` modifies existing objects. Pair with `copy_recursive=true` to also copy descendants.
        When `POST` is used, the request body may carry a JSON payload that overrides the destination object''s id.'
    copy_recursive:
      name: copy_recursive
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: When combined with `copy_uri`, copy the source object and all of its descendants into the target subtree.
        Has no effect if `copy_uri` is not set.
  responses:
    onCreate:
      description: Response on creating a new object
      content:
        application/json:
          schema: {}
      headers:
        Location:
          schema:
            type: string
          description: The URI of the resource that was just created
    onInternalServerError:
      description: |
        A `500` is a defect in the API or in the deployment, not a mistake in the request.  The following cases produce a `500`:

        1. The API failed.
        2. The directory returned a result code that the API does not map to another status.  `ldap_code` and `ldap_error` are present.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            error_msg: 'LDAP search failed after 3 attempts: Can''t contact LDAP server'
            code: 500
    onSuccess:
      description: Response sent on a successful operation which did not create an object
      content:
        application/json:
          schema: {}
        text/event-stream:
          schema: {}
    onNotFound:
      description: |
        The path of the request does not name an entry.  The following cases produce a `404`:

        1. The path is not a path that the API defines.  `ldap_code` is absent.
        2. The directory does not hold an entry at the distinguished name (DN) that the path names.  `ldap_code` is 32 (`noSuchObject`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            error_msg: LDAP object not found at cn=missing,ou=realms,dc=example,dc=org
            code: 404
            ldap_code: 32
            ldap_error: noSuchObject
    onConflict:
      description: |
        The request conflicts with the state of the directory.  The following result codes produce a `409`:

        1. `constraintViolation` (19): A value violates a uniqueness constraint of the directory, for example a second subscriber holds the same `portBindingIdentifier` as an existing subscriber.
        2. `notAllowedOnNonLeaf` (66): The request deletes an entry that has child entries.
        3. `entryAlreadyExists` (68): The request creates an entry at a distinguished name (DN) where the directory already holds an entry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            error_msg: LDAP object already exists at cn=example.org,ou=realms,dc=example,dc=org
            code: 409
            ldap_code: 68
            ldap_error: entryAlreadyExists
    onBadRequest:
      description: |
        The API or the directory rejected the request.  The API rejects a request before the request reaches the directory in the following cases.  `ldap_code` is absent in each case:

        1. The body of a POST or PUT is missing, is not valid JSON, or does not match the request body that the endpoint defines.
        2. The body holds a URL to another resource, and the host of the URL differs from the host of the request.

        The directory rejects a request that violates the state of the entry, the schema of the directory, or the syntax of a distinguished name (DN).  `ldap_code` carries the result code.  `error_msg` carries the diagnostic text of the directory.  The diagnostic text names the attribute or the value.  The following result codes produce a `400`:

        1. `protocolError` (2): An attribute in an add operation has no values.  An empty list in the body of a POST produces an attribute with no values.
        2. `noSuchAttribute` (16): The entry does not hold the attribute or the value that the request removes.
        3. `undefinedAttributeType` (17): The schema of the directory does not define the attribute.
        4. `attributeOrValueExists` (20): The entry already holds the attribute or the value that the request adds.
        5. `invalidAttributeSyntax` (21): A value does not conform to the syntax of the attribute.
        6. `invalidDNSyntax` (34): The name of the entry does not conform to the DN syntax.
        7. `namingViolation` (64): After the request, the attributes of the entry do not hold the value that names the entry.
        8. `objectClassViolation` (65): The entry holds an attribute that the object classes of the entry do not allow, or the entry lacks an attribute that the object classes require.
        9. `notAllowedOnRDN` (67): The request removes the value that names the entry.
        10. `objectClassModsProhibited` (69): The request changes the structural object class of the entry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            error_msg: 'Attribute is not in the schema at cn=example.org,ou=realms,dc=example,dc=org: notarealfield: attribute type undefined'
            code: 400
            ldap_code: 17
            ldap_error: undefinedAttributeType
    onUnauthorized:
      description: |
        The request carries no token, or the API could not verify the token.  The API fails to verify a token in the following cases:

        1. The token is malformed.
        2. The token has expired.
        3. The token is signed with a key that the key set of the issuer does not contain.
        4. The token is signed with an algorithm that the deployment does not list for the issuer.
        5. The token names an issuer that the deployment does not list.
        6. The token names an audience that the deployment does not list for the issuer.

        The `WWW-Authenticate` challenge (RFC 6750 section 3) and `error_msg` carry the reason for the refusal.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="subman", error="invalid_token", error_description="Token has expired"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            error_msg: Token has expired
            code: 401
    onForbidden:
      description: |
        The API or the directory refused the request.  The following cases produce a `403`:

        1. A Cross-Origin Resource Sharing (CORS) preflight carries an `Origin` header with a value that the deployment does not allow.  `ldap_code` is absent.
        2. The API verified the bearer token of the request, but did not derive a directory identity from the claims of the token.  `ldap_code` is absent.
        3. The directory refused the identity that the API derived from the token.  `ldap_code` is 123 (`authorizationDenied`).
        4. The access controls of the directory denied the operation.  `ldap_code` is 50 (`insufficientAccessRights`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            error_msg: Access denied at cn=example.org,ou=realms,dc=example,dc=org
            code: 403
            ldap_code: 50
            ldap_error: insufficientAccessRights
  examples: {}
  requestBodies: {}
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JSON Web Token (JWT) that an OpenID Connect identity provider issues.  The deployment lists the trusted issuers.  For each issuer, the deployment lists the accepted audiences and signing algorithms.  The API verifies the signature against the key set of the issuer and checks the `iss`, `aud`, `exp`, and `nbf` claims.  The API defines no OAuth scopes.  The API derives a directory identity from the claims of the token.  The access controls of the directory decide what the caller may read and write.

        A browser client obtains the token with the Authorization Code flow with Proof Key for Code Exchange (PKCE).  A machine client obtains the token with the `client_credentials` grant.  The API treats both tokens the same way.

        The client sends the token as `Authorization: Bearer <token>`.  A GET may carry the token in the `access_token` query parameter instead of the `Authorization` header.  See the `access_token` parameter for the conditions under which a GET may use the query parameter.
tags:
- name: Abstract profile (serviceProfile)
  description: Endpoints for managing service definitions, i.e. speed tiers or bandwidth caps.
- name: accessDevice
  description: Endpoints for managing accessDevices.  Network elements with policies associated that do not communicate directly
    with the RADIUS service.
- name: Client
  description: Endpoints for managing clients.  Network elements that communicate directly with the service.
- name: Client group
  description: Endpoints for managing groups or categories of client.
- name: Concrete profile (freeradiusProfile)
  description: Endpoints for managing concrete profiles, i.e. sets of attributes which will be returned to the NAS.
- name: Directory configuration
  description: Read-only endpoints that return the configuration of the directory, such as the access controls of each database.
- name: Global
  description: Top-level metadata endpoints not scoped to a single resource type.
- name: Health
  description: Endpoints that a monitor or a load balancer probes.  `GET /test` is the liveness probe, and proves that the API code is running.  `GET /` is the readiness probe, and proves that the API can read the directory.
- name: Realm
  description: Endpoints for managing realms.  Groups of subscribers based on virtual service.
- name: Service
  description: Endpoints for managing broad categories of service, i.e. 'GPON', 'Wireless802.11', ADSL...
- name: Subscriber
  description: Endpoints for managing subscribers.
- name: Subscriber group
  description: Endpoints for managing groups of subscribers.
security:
- AccessToken: []

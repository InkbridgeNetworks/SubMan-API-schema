        freeradiusClientComment:
          type: string
          description: A humanly readable comment associated with the client
          example: This RADIUS client authenticates all subscriber in the foo region of bar
        freeradiusClientIpV4Binding:
          type: string
          format: ipv4
          description: If set, the client may only connect to the service from this IPv4 address
          example: 192.0.2.1
        freeradiusClientIpV6Binding:
          type: string
          format: ipv6
          description: If set, the client may only connect to the service from this IPv6 address
          example: 2001:db8::1
        freeradiusClientRegion:
          type: string
          description: The region the client belongs to
          example: north-west
        radiusClientSecret:
          type: string
          example: testing123
          description: Shared secret (pre-shared key) the RADIUS client uses to communicate with the RADIUS service.  Providing
            this makes the client RADIUS-capable; removing it (a PUT without it, or a PATCH setting it to null) removes RADIUS
            capability.
          format: password
        radiusClientRequireMa:
          type: boolean
          description: Whether we requires the Message-Authenticator attribute in Access-Requests from this client
        tacacsClientSecret:
          type: string
          example: testing123
          description: Shared key the TACACS client uses to communicate with the TACACS service.  Providing this makes the
            client TACACS-capable; removing it (a PUT without it, or a PATCH setting it to null) removes TACACS capability.
